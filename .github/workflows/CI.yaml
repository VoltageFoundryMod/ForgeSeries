name: CI

on:
  push:
    branches:
      - main
    # A v* tag runs the same checks and then publishes a release. The tag names
    # the UF2, not any single module: the image is one indivisible artifact, so
    # it carries its own version while each app's lib/version.hpp keeps the
    # per-module number shown in the boot menu.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to a branch makes the in-flight run for it obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SDK the macOS packages and the standalone-module check build against.
  # Pinned rather than "latest" so the version is visible here instead of
  # changing under the build — but note VCV only hosts the current SDK, so
  # bumping this is not optional forever: once 2.6.6 is superseded the download
  # 404s and this has to move. A loud failure is the point; "latest" would keep
  # working while silently changing what shipped.
  #
  # The Windows and Linux packages do NOT use this. They are built in the
  # toolchain image, which carries its own SDK per target (~2.5.2 in the current
  # image) and caps the version for those two platforms. Mixing is safe: a Rack 2
  # plugin built against an older SDK runs on newer Rack.
  RACK_SDK_VERSION: "2.6.6"

  # Where the toolchain lives inside the container image. The image itself is
  # named at the job's `container:` key, which cannot read this — GitHub exposes
  # the env context to steps, not to job-level keys.
  RACK_TOOLCHAIN_DIR: /home/build/rack-plugin-toolchain

# Every job drives the same entry points the root Makefile gives a developer, so
# what CI checks and what you run locally cannot drift apart.
jobs:
  firmware:
    name: Firmware (unit tests + unified image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          # Deliberately no `cache: pip`. It keys the cache on a dependency
          # manifest and errors out when it finds none — this project has no
          # requirements.txt or pyproject.toml, since its one Python dependency
          # is the `pip install platformio` below. The download that would save
          # is a few MB; what is actually worth caching is ~/.platformio, next.

      # Toolchains and library dependencies, keyed on the project files that
      # decide them. ~/.platformio is where the RP2040 toolchain (~200 MB) and
      # googletest/ArduinoFake land.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Host-side googletest/ArduinoFake suites for each app that has one
      # (apps/<app>/test/test_native). Nothing here touches hardware.
      - name: Unit tests
        run: make test

      # The single image that ships: the root PlatformIO project hosts the shell
      # plus every app. The per-app hardware environments are gone, so this is
      # the only firmware build there is.
      - name: Build unified firmware
        # On a v* tag the image is stamped with it, so the boot menu tells you
        # which release is on the board. Every other build — main, a PR, a local
        # one — keeps the "dev" fallback in core/fwVersion.hpp.
        env:
          # Folded onto one line by YAML: the continuation lines are at the same
          # indent as the first, which is what makes >- join them with spaces
          # instead of keeping the newlines inside the expression.
          FORGE_EXTRA_BUILD_FLAGS: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
            && format('-DFORGE_FW_VERSION={0}', github.ref_name)
            || '' }}
        run: make unified

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: forgeseries-firmware-uf2
          path: .pio/build/xiao_rp2040/firmware.uf2
          if-no-files-found: error

  vcv-isolation:
    name: VCV engine (multi-instance isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Host compiler only. No Rack SDK is needed: fw_engine.cpp never includes
      # rack.hpp, and the shim plus the forgevcv headers live in vcvlib/ in this
      # repo (they used to be a sibling repository).
      #
      # This is the check that catches a firmware change breaking the Rack
      # ports: engine_state.def names firmware globals, so a rename that builds
      # fine for hardware can still leak state between Rack instances here.
      - name: Build and run isolation tests
        run: make isolation

  # The per-module standalone plugins are what you build while working on a
  # single module, so they have to keep compiling too. Nothing packages or ships
  # them — the aggregate plugin is what the VCV library publishes, and the
  # vcv-package jobs below build that for every platform. This job exists purely
  # to catch a stale per-module Makefile, which no other job would notice.
  vcv-plugin:
    name: VCV Rack plugin (standalone modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # plugin.mk shells out to jq to read SLUG from plugin.json. zstd is not
      # needed here: only `dist` packages a .vcvplugin, and this job only builds.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Rack SDK
        run: |
          curl -sSLo Rack-SDK.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-lin-x64.zip"
          unzip -q Rack-SDK.zip

      - name: Build standalone plugins
        run: make plugins RACK_DIR=$GITHUB_WORKSPACE/Rack-SDK

  # ── VCV plugin packages: Windows and Linux ───────────────────────────────────
  # Cross-compiled in qno's prebuilt toolchain image, which carries the mingw-w64
  # and ubuntu16.04 cross toolchains plus a Rack SDK per target. Building the
  # Linux package against an ubuntu16.04 sysroot is the point of using it: the
  # result runs on distributions far older than the runner, which a plain
  # ubuntu-latest build would not.
  #
  # Two things make this work for THIS plugin:
  #
  #   * PLUGIN_DIR is vcv/, not the repository root. The aggregate plugin lives
  #     there; the root is a PlatformIO project.
  #   * The toolchain builds in place — `cd $(PLUGIN_DIR) && make dist` — rather
  #     than copying the plugin elsewhere. That is required here, because
  #     vcv/Makefile pulls its sources from ../apps/<module>/vcv-plugin/ and
  #     ../vcvlib, so the plugin only builds inside a full checkout.
  vcv-package:
    name: VCV plugin (${{ matrix.platform }})
    runs-on: ubuntu-latest

    container:
      # Untagged, i.e. :latest — which is the configuration this image is
      # actually used in and known to work with the arch-suffixed targets below.
      # It is a mutable tag, though the current build has been stable since
      # 2024-06; pin it by digest if a release ever needs to be reproducible.
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      # The toolchain's Makefile writes under /home/build.
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The toolchain sets RACK_DIR, CC/CXX and STRIP for the chosen target
      # itself, so nothing here needs to know the cross-compiler triples.
      - name: Build and package plugin
        run: |
          export PLUGIN_DIR="$GITHUB_WORKSPACE/vcv"
          cd "$RACK_TOOLCHAIN_DIR"
          make plugin-build-${{ matrix.platform }}

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: vcvplugin-${{ matrix.platform }}
          path: ${{ env.RACK_TOOLCHAIN_DIR }}/plugin-build/*.vcvplugin
          if-no-files-found: error

  # ── VCV plugin packages: macOS ───────────────────────────────────────────────
  # Apple targets are not in the container: cross-compiling them needs the real
  # SDK, so they are built on a mac runner instead. Both architectures come from
  # the same runner via CROSS_COMPILE, so the runner's own architecture does not
  # decide what ships.
  vcv-package-mac:
    name: VCV plugin (mac-${{ matrix.arch }})
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Rack SDK
        run: |
          curl -sSLo Rack-SDK.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-${{ matrix.arch }}.zip"
          unzip -q Rack-SDK.zip -d "$HOME"

      # Through the root Makefile, like every other job here, so CI and a
      # developer run the same recipe. No `make dep` step: this plugin declares
      # no DEPS, and the toolchain image covers that case for the other targets.
      - name: Build and package plugin
        run: |
          case "${{ matrix.arch }}" in
            x64)   export CROSS_COMPILE=x86_64-apple-darwin ;;
            arm64) export CROSS_COMPILE=arm64-apple-darwin ;;
          esac
          make vcv-dist RACK_DIR="$HOME/Rack-SDK"
          echo "Built architecture: $(lipo -archs vcv/plugin.dylib)"

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: vcvplugin-mac-${{ matrix.arch }}
          path: vcv/dist/*.vcvplugin
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────────────────────────
  # Publishes the flashable image and the plugin package for every platform. Only
  # a v* tag gets here; a push to main stops at the build artifacts above.
  release:
    name: Release (UF2 + VCV plugins)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Gated on everything, not just the firmware build. The Rack ports compile
    # the same lib/ sources, so a green firmware with a red vcv-isolation means a
    # firmware global changed behind engine_state.def — not something to publish
    # an image for. The package jobs are here too: a release missing a platform
    # is worse than a release that waited.
    needs: [firmware, vcv-isolation, vcv-plugin, vcv-package, vcv-package-mac]

    # The default token is read-only for repository contents, which is not
    # enough to cut a release or attach an asset to it.
    permissions:
      contents: write

    steps:
      # --generate-notes diffs the tag against its predecessor, so the shallow
      # default checkout is not enough — it needs the tag history.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every artifact from this run, each in its own subdirectory. These are the
      # exact binaries CI built and tested, rather than a second build of the
      # same commit.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts

      - name: Collect release assets
        run: |
          mkdir -p dist

          # A bare firmware.uf2 is unidentifiable once it is in a downloads
          # folder beside older ones, and the RP2040 bootloader takes any
          # filename.
          mv _artifacts/forgeseries-firmware-uf2/firmware.uf2 \
             "dist/ForgeSeries-${GITHUB_REF_NAME}.uf2"

          # The .vcvplugin names already carry slug, plugin version, os and cpu,
          # so they are flattened in as they are.
          find _artifacts -name '*.vcvplugin' -exec mv {} dist/ \;

          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ForgeSeries $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
