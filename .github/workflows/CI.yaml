name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  firmware:
    name: Firmware (RP2040 + unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run -e xiao_rp2040

  vcv-engine:
    name: VCV engine (multi-instance isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Arduino shim and the reusable forgevcv layer live in a sibling repo.
      # Building the isolation test needs no Rack SDK — fw_engine.cpp never
      # includes rack.hpp.
      - name: Checkout ForgeSeries-VCVLib
        uses: actions/checkout@v4
        with:
          repository: VoltageFoundryMod/ForgeSeries-VCVLib
          path: ForgeSeries-VCVLib

      - name: Build and run isolation test
        working-directory: vcv-plugin
        env:
          FORGEVCV: ../ForgeSeries-VCVLib
        run: test/build_isolation_test.sh
