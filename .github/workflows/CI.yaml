name: CI

on:
  push:
    branches:
      - main
    # A v* tag runs the same checks and then publishes a release. The tag names
    # the UF2, not any single module: the image is one indivisible artifact, so
    # it carries its own version while each app's lib/version.hpp keeps the
    # per-module number shown in the boot menu.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to a branch makes the in-flight run for it obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job drives the same entry points the root Makefile gives a developer, so
# what CI checks and what you run locally cannot drift apart.
jobs:
  firmware:
    name: Firmware (unit tests + unified image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          # Deliberately no `cache: pip`. It keys the cache on a dependency
          # manifest and errors out when it finds none — this project has no
          # requirements.txt or pyproject.toml, since its one Python dependency
          # is the `pip install platformio` below. The download that would save
          # is a few MB; what is actually worth caching is ~/.platformio, next.

      # Toolchains and library dependencies, keyed on the project files that
      # decide them. ~/.platformio is where the RP2040 toolchain (~200 MB) and
      # googletest/ArduinoFake land.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Host-side googletest/ArduinoFake suites for each app that has one
      # (apps/<app>/test/test_native). Nothing here touches hardware.
      - name: Unit tests
        run: make test

      # The single image that ships: the root PlatformIO project hosts the shell
      # plus every app. The per-app hardware environments are gone, so this is
      # the only firmware build there is.
      - name: Build unified firmware
        # On a v* tag the image is stamped with it, so the boot menu tells you
        # which release is on the board. Every other build — main, a PR, a local
        # one — keeps the "dev" fallback in core/fwVersion.hpp.
        env:
          # Folded onto one line by YAML: the continuation lines are at the same
          # indent as the first, which is what makes >- join them with spaces
          # instead of keeping the newlines inside the expression.
          FORGE_EXTRA_BUILD_FLAGS: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
            && format('-DFORGE_FW_VERSION={0}', github.ref_name)
            || '' }}
        run: make unified

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: forgeseries-firmware-uf2
          path: .pio/build/xiao_rp2040/firmware.uf2
          if-no-files-found: error

  vcv-isolation:
    name: VCV engine (multi-instance isolation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Host compiler only. No Rack SDK is needed: fw_engine.cpp never includes
      # rack.hpp, and the shim plus the forgevcv headers live in vcvlib/ in this
      # repo (they used to be a sibling repository).
      #
      # This is the check that catches a firmware change breaking the Rack
      # ports: engine_state.def names firmware globals, so a rename that builds
      # fine for hardware can still leak state between Rack instances here.
      - name: Build and run isolation tests
        run: make isolation

  vcv-plugin:
    name: VCV Rack plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # plugin.mk shells out to jq (reads SLUG from plugin.json) and, for dist,
      # to zstd — a .vcvplugin is a zstd-compressed tar, not a zip.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zstd

      - name: Download Rack SDK
        run: |
          curl -sSLo Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-latest-lin-x64.zip
          unzip -q Rack-SDK.zip

      # The aggregate plugin — every module in one binary, which is what the VCV
      # library publishes.
      - name: Build aggregate plugin
        run: make vcv RACK_DIR=$GITHUB_WORKSPACE/Rack-SDK

      - name: Package aggregate plugin
        run: make vcv-dist RACK_DIR=$GITHUB_WORKSPACE/Rack-SDK

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: VoltageFoundryMod-plugin-lin-x64
          path: vcv/dist/*.vcvplugin
          if-no-files-found: error

      # The per-module standalone plugins are what you build while working on a
      # single module, so they have to keep compiling too. Same sources, so this
      # is cheap; it only catches a stale per-module Makefile.
      - name: Build standalone plugins
        run: make plugins RACK_DIR=$GITHUB_WORKSPACE/Rack-SDK

  # ── Release ──────────────────────────────────────────────────────────────────
  # Publishes the flashable image. Only a v* tag gets here; a push to main stops
  # at the build artifact above.
  release:
    name: Release (UF2)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Gated on the whole matrix, not just the firmware build. The Rack ports
    # compile the same lib/ sources, so a green firmware with a red
    # vcv-isolation means a firmware global changed behind engine_state.def —
    # not something to publish an image for.
    needs: [firmware, vcv-isolation, vcv-plugin]

    # The default token is read-only for repository contents, which is not
    # enough to cut a release or attach an asset to it.
    permissions:
      contents: write

    steps:
      # --generate-notes diffs the tag against its predecessor, so the shallow
      # default checkout is not enough — it needs the tag history.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The exact image CI built and tested, rather than a second build of the
      # same commit.
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: forgeseries-firmware-uf2
          path: dist

      # A bare firmware.uf2 is unidentifiable once it is in a downloads folder
      # beside older ones, and the RP2040 bootloader takes any filename.
      - name: Name the asset after the tag
        run: mv dist/firmware.uf2 "dist/ForgeSeries-${GITHUB_REF_NAME}.uf2"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ForgeSeries $GITHUB_REF_NAME" \
            --generate-notes \
            "dist/ForgeSeries-${GITHUB_REF_NAME}.uf2"
