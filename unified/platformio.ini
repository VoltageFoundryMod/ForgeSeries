; ForgeSeries unified firmware — one image, one shell, several apps.
;
; A separate PlatformIO project from apps/<app>/ because PlatformIO scopes
; src_dir and lib_dir per project, not per environment: this one compiles the
; shell plus one translation unit per app, where each of those builds only its
; own module.
;
; Every app's sources are pulled in by include path rather than being copied, so
; apps/<app>/ stays the single source of truth and its standalone firmware and
; VCV plugin keep building unchanged.

[platformio]
default_envs = xiao_rp2040

[env:xiao_rp2040]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
; Persistent storage lives in a LittleFS region at the top of flash, NOT in the
; emulated EEPROM sector — see core/fsStore.hpp for why. 256k against a 2 MB
; part and a ~210k image is free, and it must stay the same size across
; releases or the region moves and every stored file is lost.
board_build.filesystem_size = 256k
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit MCP4728@^1.0.10
	EEPROM
	LittleFS
build_flags =
	-std=gnu++17
	-O3
	-Wl,--gc-sections
	-DUSE_TINYUSB
	; Apps persist presets through core/fsStore.hpp rather than the emulated
	; EEPROM sector, which four apps cannot share. See apps/*/lib/storage.hpp.
	-DFORGE_USE_FS
	; This image has a shell behind it, so an app's menu can ask to be sent back
	; to the module selector (forge::RequestAppMenu). The VCV ports compile the
	; same lib/ without a shell, and key off this being absent.
	-DFORGE_UNIFIED
	; The shared platform layer.
	-I ../core
	; Each module's src/, which holds only its uniquely-named <app>_app.hpp
	; factory — no shadowing risk, unlike putting the lib/ dirs on the path.
	-I ../apps/clk/src
	-I ../apps/dq/src
	-I ../apps/gen/src
	-I ../apps/scp/src
	; NOTE: deliberately no -I for the apps. Each app TU includes its own
	; headers by explicit relative path, so once the first include lands in
	; apps/<app>/lib/ every transitive quoted include resolves relative to that
	; directory first. With -I paths instead, GravityForge picked up NoteForge's
	; quantizer.hpp purely because dq came first in the list.

; The shell is unified/src; each module's app TU lives beside its own lib/, so
; it is pulled in explicitly. Paths are relative to src_dir.
build_src_filter =
	+<*>
	+<../../apps/clk/src/clk_app.cpp>
	+<../../apps/dq/src/dq_app.cpp>
	+<../../apps/gen/src/gen_app.cpp>
	+<../../apps/scp/src/scp_app.cpp>
