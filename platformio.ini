; ForgeSeries unified firmware — one image, one shell, several apps.
;
; This is the repository root's PlatformIO project, and the only firmware built
; for the board. It stays separate from apps/<app>/ because PlatformIO scopes
; src_dir and lib_dir per project, not per environment: this one compiles the
; shell plus one translation unit per app, where each of those builds only its
; own module.
;
; Every app's sources are pulled in by include path rather than being copied, so
; apps/<app>/ stays the single source of truth and its standalone firmware and
; VCV plugin keep building unchanged.

[platformio]
default_envs = xiao_rp2040
; The host test suites live with the modules they exercise, under
; apps/<app>/test/test_native/. Pointing test_dir at apps/ lets this one project
; own them all — see the native environments at the bottom of this file.
test_dir = apps

[env:xiao_rp2040]
; test_dir points at apps/, and this is the only environment a bare `pio test`
; considers (default_envs above scopes test as well as run). The suites there are
; host-only — googletest and ArduinoFake, no Arduino framework — and belong to
; the native_* environments at the bottom of this file, so this one claims none
; of them: `pio test` reports nothing to do instead of trying to cross-compile
; them for the board. `make test` drives the native envs by name.
test_ignore = *
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
; Persistent storage lives in a LittleFS region at the top of flash, NOT in the
; emulated EEPROM sector — see core/fsStore.hpp for why. 256k against a 2 MB
; part and a ~210k image is free, and it must stay the same size across
; releases or the region moves and every stored file is lost.
board_build.filesystem_size = 256k
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit MCP4728@^1.0.10
	EEPROM
	LittleFS
build_flags =
	-std=gnu++17
	-O3
	-Wl,--gc-sections
	-DUSE_TINYUSB
	; Apps persist presets through core/fsStore.hpp rather than the emulated
	; EEPROM sector, which four apps cannot share. See apps/*/lib/storage.hpp.
	-DFORGE_USE_FS
	; This image has a shell behind it, so an app's menu can ask to be sent back
	; to the module selector (forge::RequestAppMenu). The VCV ports compile the
	; same lib/ without a shell, and key off this being absent.
	-DFORGE_UNIFIED
	; The shared platform layer.
	-I core
	; Each module's src/, which holds only its uniquely-named <app>_app.hpp
	; factory — no shadowing risk, unlike putting the lib/ dirs on the path.
	-I apps/clk/src
	-I apps/dq/src
	-I apps/gen/src
	-I apps/scp/src
	; NOTE: deliberately no -I for the apps. Each app TU includes its own
	; headers by explicit relative path, so once the first include lands in
	; apps/<app>/lib/ every transitive quoted include resolves relative to that
	; directory first. With -I paths instead, GravityForge picked up NoteForge's
	; quantizer.hpp purely because dq came first in the list.
	;
	; Extra flags from the environment — empty for a normal local build. CI uses
	; it to stamp the release tag into the image, which the boot menu shows:
	;     FORGE_EXTRA_BUILD_FLAGS=-DFORGE_FW_VERSION=v4.0.0
	; The variable holds the whole flag rather than just the version, so that
	; when it is unset it expands to nothing at all and core/fwVersion.hpp can
	; fall back to "dev" — spelling it -DFORGE_FW_VERSION=${sysenv...} instead
	; would define the macro empty on every local build.
	;
	; PLATFORMIO_BUILD_FLAGS would also work (it appends to this list rather
	; than replacing it), but naming the variable here keeps the injection point
	; visible to anyone reading the build config.
	${sysenv.FORGE_EXTRA_BUILD_FLAGS}

; The shell is src/; each module's app TU lives beside its own lib/, so it is
; pulled in explicitly. Paths are relative to src_dir.
build_src_filter =
	+<*>
	+<../apps/clk/src/clk_app.cpp>
	+<../apps/dq/src/dq_app.cpp>
	+<../apps/gen/src/gen_app.cpp>
	+<../apps/scp/src/scp_app.cpp>

; ── Native unit tests ────────────────────────────────────────────────────────
; googletest + ArduinoFake suites for the modules that have them, exercising
; apps/<app>/lib/ on the host. No hardware, no Arduino framework.
;
; ONE ENVIRONMENT PER APP, deliberately. A single shared env would have to put
; every app's lib/ on the include path at once, and eight basenames collide
; across clk, dq and gen — engine.hpp, storage.hpp, cvInputs.hpp, version.hpp
; and four menu*.hpp. Whichever -I came first would win for all three suites,
; which is exactly the cross-wiring described at the top of this file. Each env
; below sees its own module and nothing else.
[native_base]
platform = native
test_framework = googletest
build_flags = -std=gnu++17 -I core -DUNIT_TEST
lib_deps =
	google/googletest@^1.12.1
	fabiobatsilva/ArduinoFake@^0.4.0

[env:native_clk]
extends = native_base
build_flags = ${native_base.build_flags} -I apps/clk/lib
test_filter = clk/test/test_native

[env:native_dq]
extends = native_base
build_flags = ${native_base.build_flags} -I apps/dq/lib
test_filter = dq/test/test_native

[env:native_gen]
extends = native_base
build_flags = ${native_base.build_flags} -I apps/gen/lib
test_filter = gen/test/test_native
