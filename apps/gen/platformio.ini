; PlatformIO Project Configuration File
;
; GravityForge — dual physics-based generative sequencer for the Forge Series.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_rp2040

[env]
build_flags = -std=gnu++17 -I lib -I ../../core

[env:xiao_rp2040]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
monitor_speed = 115200
test_ignore = test_native
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit MCP4728@^1.0.10
	; EEPROM is bundled with the arduino-pico framework; naming it here makes
	; LDF add it (storage.hpp includes <EEPROM.h>). No vendored copy needed.
	EEPROM
build_flags =
	-std=gnu++17
	-I lib -I ../../core
	-O3
	-Wl,--gc-sections
	-DUSE_TINYUSB

[env:native]
platform = native
test_framework = googletest
build_flags = -std=gnu++17 -I lib -I ../../core -DUNIT_TEST
lib_deps =
	google/googletest@^1.12.1
	fabiobatsilva/ArduinoFake@^0.4.0
