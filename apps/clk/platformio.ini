; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_rp2040

[env]
build_flags = -std=gnu++17 -I lib -I ../../core

[env:xiao_rp2040]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
; Presets and calibration live on LittleFS, not the 4096-byte emulated EEPROM
; sector — see core/appStorage.hpp. Must stay the same size across releases or
; the region moves and stored files are lost.
board_build.filesystem_size = 256k
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit MCP4728@^1.0.10
	; EEPROM is bundled with the arduino-pico framework; naming it here makes
	; LDF add it (storage.hpp includes <EEPROM.h>). No vendored copy needed.
	EEPROM
	LittleFS
build_flags =
	-std=gnu++17
	-I lib -I ../../core
	-O3
	-Wl,--gc-sections
	-DUSE_TINYUSB
	-DFORGE_USE_FS
	; Some debug flags that can be enabled for development purposes
	; -DENVELOPE_DEBUG
	; -DPERFORMANCE_DEBUG

[env:native]
platform = native
test_framework = googletest
lib_deps =
	google/googletest@^1.12.1
	fabiobatsilva/ArduinoFake@^0.4.0
