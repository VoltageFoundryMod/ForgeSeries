; dq — native unit tests only.
;
; The hardware environment is gone: this module ships inside the unified
; firmware (../../unified), which is the only image built for the board now.
; src/main.cpp is kept for reference until the unified build has been verified
; on hardware for every module, but nothing compiles it.
;
; What remains is the googletest/ArduinoFake project behind `make test`, which
; exercises lib/ on the host and has no hardware dependency.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = googletest
build_flags = -std=gnu++17 -I lib -I ../../core -DUNIT_TEST
lib_deps =
	google/googletest@^1.12.1
	fabiobatsilva/ArduinoFake@^0.4.0
